[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firetransformer-wfiot"
version = "2.0.0"
description = "Leakage-controlled FireTransformer evaluation for horizon-based wildfire early warning in IoT sensor networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
  "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
